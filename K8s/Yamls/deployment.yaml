---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testpods
  labels:
    app: testpods
spec:
  replicas: 3
  selector:
    matchLabels:
      app: testpods
  template:
    metadata:
      labels:
        app: testpods
    spec:
      containers:
      - name: kubegame
        image: kiran2361993/kubegame:v2
        ports:
        - containerPort: 80   # recommended
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
