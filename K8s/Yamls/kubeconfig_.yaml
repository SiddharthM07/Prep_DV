#user1
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://api.soapfree.online
    tls-server-name: api.internal.soapfree.online
  name: soapfree.online
contexts:
- context:
    cluster: soapfree.online
    namespace: dev
    user: user1
  name: user1-context
current-context: user1-context
kind: Config
users:
- name: user1
  user:
    client-certificate-data: /root/user1.crt
    client-key-data: /root/user1.key


