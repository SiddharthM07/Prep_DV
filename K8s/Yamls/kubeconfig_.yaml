apiVersion: v1
kind: Config

clusters:
- name: soapfree.online
  cluster:
    server: https://api.soapfree.online
    tls-server-name: api.internal.soapfree.online
    certificate-authority: /root/ca.crt

contexts:
- name: user1-context
  context:
    cluster: soapfree.online
    namespace: dev
    user: user1

current-context: user1-context

users:
- name: user1
  user:
    client-certificate: /root/user1.crt
    client-key: /root/user1.key
