  kind: Secret
  metadata:
    name: aws-creds-in-file
  type: Opaque
  stringData:
    credentials: |
      [default]
      aws_access_key_id = 
      aws_secret_access_key = 

  # Mount AWS Credentials as a volume
  ---
  
  apiVersion: v1
  kind: Pod
  metadata:
    name: secret-test-pod-1
  spec:
    containers:
      - name: aws-cli-container
        image: kiran2361993/troubleshootingtools:v1
        volumeMounts:
          - name: secret-volume
            mountPath: /root/.aws/credentials
            subPath: credentials
            readOnly: true
    volumes:
      - name: secret-volume
        secret:
          secretName: aws-creds-in-file
