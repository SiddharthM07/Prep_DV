#Claims

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      name: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        name: mongodb
    spec:
      containers:
      - image: mongo
        name: mongodb
        imagePullPolicy: Always
        volumeMounts:
        - name: mongodb-data1
          mountPath: /data/db
        - name: mongodb-data2
          mountPath: /tmp/db1
        - name: mongodb-data3
          mountPath: /tmp/db2
        - name: mongodb-data4
          mountPath: /tmp/db3
      volumes:
      - name: mongodb-data1
        persistentVolumeClaim:
           claimName: task-pv-claim1
      - name: mongodb-data2
        persistentVolumeClaim:
           claimName: task-pv-claim2
      - name: mongodb-data3
        persistentVolumeClaim:
           claimName: task-pv-claim3
      - name: mongodb-data4
        persistentVolumeClaim:
           claimName: task-pv-claim4
      nodeSelector:
          kubernetes.io/hostname: i-0eabc073991b3166c

---
#storageclass

#Creating gp2 storage class and making it default
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: gp2
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp2
  fsType: ext4 

#Creating io storage class
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: io1
provisioner: kubernetes.io/aws-ebs
parameters:
  type: io1
  iopsPerGB: "10"
  fsType: ext4

---
#emptydir

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: troubleshooting
          image: kiran2361993/troubleshootingtools:v1
          volumeMounts:
            - name: myemptydir
              mountPath: /etc/myemptydir
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /tmp/myemptydir
              name: myemptydir
      volumes:
        - name: myemptydir
          emptyDir: {}
